name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        exclude:
          # Laravel 13 requires PHP ^8.3.
          - php: '8.2'
            laravel: '13.*'
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
      - name: composer validate (strict)
        run: composer validate --strict
      - run: composer require "laravel/framework:${{ matrix.laravel }}" --no-update
      - run: composer update --prefer-dist --no-progress
      - name: security audit
        run: composer audit --no-dev --abandoned=ignore
      - run: vendor/bin/pest --coverage --min=80
      - run: composer stan
      - name: forbid stray debug calls
        run: |
          ! grep -rnE '\b(dd|var_dump)\(' src tests
